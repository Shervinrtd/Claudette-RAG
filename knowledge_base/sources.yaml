- id: ruggeri2022
  citation: "Ruggeri, F., Lagioia, F., Lippi, M., Torroni, P. (2022). Detecting and explaining unfairness in consumer contracts through memory networks. Artificial Intelligence and Law, 30(1), 59-92. Preprint: arXiv:2008.07346."
