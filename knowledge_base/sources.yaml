# Bibliography of the knowledge base. Every `source` field elsewhere must use one of these ids.

- id: lippi2019
  citation: "Lippi, M., Pałka, P., Contissa, G., Lagioia, F., Micklitz, H.-W., Sartor, G., Torroni, P. (2019). CLAUDETTE: an automated detector of potentially unfair clauses in online terms of service. Artificial Intelligence and Law, 27, 117-139."
